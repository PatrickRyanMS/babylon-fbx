<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FBX Loader — Babylon.js Viewer</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        #status {
            position: absolute; bottom: 10px; left: 10px;
            color: #eee; font-family: monospace; font-size: 13px;
            background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 4px;
            max-width: min(760px, calc(100vw - 44px));
            line-height: 1.35;
        }
        #status .status-summary {
            font-weight: 700;
            margin-bottom: 4px;
        }
        #status .status-row {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 8px;
        }
        #status .status-label {
            color: #9fd0ff;
        }
        #status .status-alert .status-label,
        #status .status-alert .status-value {
            color: #ffd27d;
        }
        #gui {
            position: absolute; top: 10px; left: 10px;
            display: flex; gap: 8px; align-items: center;
            font-family: monospace; font-size: 13px;
        }
        #gui select {
            padding: 6px 10px; border-radius: 4px; border: 1px solid #555;
            background: #222; color: #eee; font-size: 13px;
        }
        #gui button {
            padding: 6px 14px; border-radius: 4px; border: 1px solid #555;
            background: #333; color: #eee; cursor: pointer; font-size: 13px;
        }
        #gui button:hover { background: #444; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="gui"></div>
    <div id="status">Loading...</div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
